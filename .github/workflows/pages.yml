name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the static demo
        run: bun run build:pages
        env:
          # Project sites use /<repository>. Set the repository variable to
          # override the value for custom domains or user sites.
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH || steps.pages.outputs.base_path }}
          PUBLIC_HOSTING_MODE: static
          # Optional and safe to expose. Leave the variable empty to require
          # visitors to paste their own public agent id.
          PUBLIC_ELEVENLABS_AGENT_ID: ${{ vars.PUBLIC_ELEVENLABS_AGENT_ID }}

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
