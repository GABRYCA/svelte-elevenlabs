name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, test, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check Svelte and TypeScript
        run: bun run check

      - name: Run the offline test suite
        run: bun run test

      - name: Check formatting and lint
        run: bun run lint

      - name: Build the Node app and package
        run: bun run build

      - name: Build the static demo
        run: bun run build:pages
        env:
          PAGES_BASE_PATH: /svelte-elevenlabs
          PUBLIC_HOSTING_MODE: static

  node:
    name: Node 22.17 runtime tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Set up the minimum supported Node version
        uses: actions/setup-node@v7
        with:
          node-version: 22.17.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the offline test suite with Node
        run: node node_modules/vitest/vitest.mjs run
